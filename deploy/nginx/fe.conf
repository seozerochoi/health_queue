server {
    listen 80;
    server_name 43.201.88.27;

    # FE 정적 파일 루트
    root /var/www/fe/dist;
    index index.html;

    location = /favicon.ico { access_log off; log_not_found off; }
    
    location /static/ {
        root /home/ubuntu/healthqueue;
    }

    # ============================================================
    # API 요청 기본 프록시 (모든 /api/* 요청)
    # ============================================================
    location /api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;

        # ⚡ CRITICAL: 타임아웃 설정 (기본 60s → 300s)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 버퍼링 비활성화 (SSE 대비)
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ============================================================
    # SSE: equipment stream (특별 설정)
    # ============================================================
    location /api/equipment/stream {
        # 기본 proxy 공통 설정 재사용
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 스트리밍 필수
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;

        # 안정성 타임아웃 (Gunicorn 300s보다 넉넉)
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        # gzip 비활성 (스트림 교란 방지)
        gzip off;
    }

    # ============================================================
    # SSE: operator notifications
    # ============================================================
    location /api/operator-notifications {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 스트리밍 필수
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;

        # 타임아웃 (SSE 유지)
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        # gzip 비활성
        gzip off;
    }

    # ============================================================
    # SSE: workouts heartbeat (워크아웃 SSE)
    # ============================================================
    location /api/workouts/heartbeat {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 스트리밍 필수
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Accel-Buffering no always;

        # 타임아웃 (SSE 유지)
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        # gzip 비활성
        gzip off;
    }

    # ============================================================
    # media 폴더 alias
    # ============================================================
    location /media/ {
        alias /home/ubuntu/healthqueue/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Accept, Origin' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;

        try_files $uri $uri/ =404;
    }

    # ============================================================
    # FE SPA 라우팅: 존재하지 않는 경로는 index.html로
    # 반드시 /api/, /static/, /media/ 이후에 위치
    # ============================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱 (JS, CSS, 이미지 등)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # gzip 압축 활성화
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1024;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 로그
    access_log /var/log/nginx/fe_access.log;
    error_log /var/log/nginx/fe_error.log;
}
